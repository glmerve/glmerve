<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <style>
      .text {
        font-family: 'Courier New', Courier, monospace;
        font-size: 18px;
        fill: #FFB000;
        font-weight: bold;
        text-shadow: 0 0 4px #FFB000;
      }
      .blink {
        animation: blinker 1s linear infinite;
      }
      @keyframes blinker {
        50% { opacity: 0; }
      }
      .line {
        opacity: 0;
      }
      .l1 { animation: show 0.1s forwards; animation-delay: 0.5s; }
      .l2 { animation: show 0.1s forwards; animation-delay: 1.0s; }
      .l3 { animation: show 0.1s forwards; animation-delay: 2.0s; }
      .l4 { animation: show 0.1s forwards; animation-delay: 2.5s; }
      .l5 { animation: show 0.1s forwards; animation-delay: 3.5s; }
      .l6 { animation: show 0.1s forwards; animation-delay: 4.0s; }
      .l7 { animation: show 0.1s forwards; animation-delay: 4.5s; }
      @keyframes show { to { opacity: 1; } }
    </style>
    <!-- CRT Curved Screen Filter -->
    <radialGradient id="screen-glare" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bezel-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2DAC3"/>
      <stop offset="100%" stop-color="#C2B7A0"/>
    </linearGradient>
  </defs>

  <!-- Background for shadow -->
  <rect x="40" y="10" width="520" height="430" fill="#ffffff" fill-opacity="0"/>

  <!-- Monitor Base/Stand -->
  <path d="M 240 380 L 360 380 L 390 430 L 210 430 Z" fill="#B3A790" stroke="#8C7A60" stroke-width="2"/>
  <rect x="250" y="370" width="100" height="20" fill="#A99A80"/>

  <!-- Monitor Case -->
  <rect x="50" y="20" width="500" height="350" rx="20" fill="url(#bezel-gradient)" stroke="#A99A80" stroke-width="4"/>
  
  <!-- Outer Bezel indent -->
  <rect x="65" y="35" width="470" height="300" rx="15" fill="#C2B7A0" stroke="#8C7A60" stroke-width="2"/>

  <!-- Screen Glass -->
  <rect x="80" y="50" width="440" height="270" rx="25" fill="#0c0c0c" stroke="#222" stroke-width="5"/>
  
  <!-- Screen Content -->
  <g transform="translate(100, 80)">
    <text x="0" y="20" class="text line l1">C:\&gt; whoami</text>
    <text x="0" y="50" class="text line l2">Mervegül Süral</text>
    <text x="0" y="90" class="text line l3">C:\&gt; type skills.txt</text>
    <text x="0" y="120" class="text line l4">TS, JS, Python, React, SQL, Docker</text>
    <text x="0" y="160" class="text line l5">C:\&gt; echo Welcome!</text>
    <text x="0" y="190" class="text line l6">Welcome!</text>
    <text x="0" y="230" class="text line l7">C:\&gt; <tspan class="blink">_</tspan></text>
  </g>

  <!-- Screen Glare Overlay -->
  <rect x="80" y="50" width="440" height="270" rx="25" fill="url(#screen-glare)" pointer-events="none"/>
  
  <!-- Scanlines (subtle overlay) -->
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" fill-opacity="0.3"/>
  </pattern>
  <rect x="80" y="50" width="440" height="270" rx="25" fill="url(#scanlines)" pointer-events="none"/>

  <!-- Monitor details (Logo, power button, vents) -->
  <rect x="100" y="350" width="40" height="5" fill="#8C7A60" rx="2"/>
  <rect x="100" y="360" width="40" height="5" fill="#8C7A60" rx="2"/>
  <text x="275" y="362" font-family="sans-serif" font-size="14" fill="#8C7A60" font-weight="bold">VT320</text>
  <!-- Power button -->
  <circle cx="480" cy="355" r="8" fill="#555"/>
  <circle cx="480" cy="355" r="4" fill="#39FF14"/>
</svg>
